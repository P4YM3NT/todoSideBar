appId: de.ptr-digital.todo-sidebar
productName: Todo Sidebar
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
