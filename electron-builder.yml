appId: de.ptr-digital.todo-sidebar
productName: Todo Sidebar
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

mac:
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!.gitkeep"

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
